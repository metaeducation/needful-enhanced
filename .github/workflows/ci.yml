#
# File: %ci.yml
#
#=============================================================================#
#
# Runs needful-enhanced tests against needful.h fetched from its repository.
#
# Positive tests (tests/positive/) are compiled as executables and run;
# they must exit 0.  Negative tests (tests/negative/) are fed directly to
# the compiler and must FAIL to compile (enforced via CTest WILL_FAIL).
#
# needful.h is fetched from its repository at the start of each job and
# placed one directory above the repo checkout, which is where the
# CMakeLists.txt expects to find it by default.
#
# The raw GitHub URL for needful.h is:
#
#   https://raw.githubusercontent.com/metaeducation/needful/main/needful.h
#

name: needful-enhanced CI


on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allows running this workflow manually from Actions tab


defaults:
  run:
    shell: bash  # Use bash on all platforms, including Windows


jobs:
  tests:

    strategy:
      fail-fast: false  # Run all matrix entries even if one fails
      matrix:
        include:

          - os: ubuntu-latest
            label: linux-gcc
            cxx: g++
            cc: gcc
            cmake-generator: Unix Makefiles
            msvc: false

          - os: ubuntu-latest
            label: linux-clang
            cxx: clang++
            cc: clang
            cmake-generator: Unix Makefiles
            msvc: false

          - os: macos-latest
            label: macos-clang
            cxx: clang++
            cc: clang
            cmake-generator: Unix Makefiles
            msvc: false

          - os: windows-2022
            label: windows-msvc
            cxx: cl
            cc: cl
            cmake-generator: NMake Makefiles
            msvc: true

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}


    steps:


  #====# CHECKOUT STEPS #=====================================================#

    # https://github.com/actions/checkout
    #
    - uses: actions/checkout@v5


    # needful.h lives one level above the needful-enhanced repo checkout.
    # dirname strips the last path component: .../needful-enhanced => .../
    #
    # Fetched through the API rather than raw.githubusercontent.com.  The raw
    # host sits behind a Varnish cache with `Cache-Control: max-age=300`, so
    # pushing needful.h and running this workflow inside that five-minute window
    # serves the *previous* copy with no sign anything is stale -- the byte count
    # and the HTTP 200 both look perfectly normal.  (This is not hypothetical; it
    # cost a confusing CI failure.)
    #
    # The API is not a cure, only an improvement: it is also cached, at
    # `max-age=60`.  A five-fold smaller window, but still a window -- which is
    # why the retry below is the part actually doing the work.
    #
    # Its ETag is the git blob SHA of what was served, so logging it makes a
    # stale fetch diagnosable after the fact:  compare against
    # `git hash-object needful.h` in the needful repo.
    #
    # (github.token only raises the rate limit -- the repository is public, but
    # unauthenticated API calls share a 60/hour budget across all of Actions.)
    #
    # The fetched file is then checked for NUL bytes before anything is
    # configured or compiled.  needful.h is hand-copied into the repository that
    # publishes it, and a shared-folder copy once produced a file of exactly the
    # right length whose tail was NUL padding -- committed and served without
    # complaint, surfacing only as hundreds of "null character ignored" warnings
    # from a compiler that otherwise carried on.  See run-header-integrity.cmake.
    #
    # A failed check is retried rather than fatal on the first attempt: if the
    # cause is a stale intermediary rather than a damaged commit, waiting is the
    # cure.  A genuinely damaged upstream still fails, just a few minutes later.
    #
    - name: Fetch And Verify needful.h
      run: |
        NEEDFUL_H_DIR="$(dirname "$GITHUB_WORKSPACE")"
        DEST="$NEEDFUL_H_DIR/needful.h"
        API="https://api.github.com/repos/metaeducation/needful/contents/needful.h?ref=main"

        HDRS="$(mktemp)"  # not $RUNNER_TEMP: on Windows that is a \-separated path

        for attempt in 1 2 3 4; do
          curl -fsSL -D "$HDRS" \
            -H "Accept: application/vnd.github.raw" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Cache-Control: no-cache" \
            "$API" -o "$DEST"

          BLOB="$(grep -i '^etag:' "$HDRS" | tr -d '\r' | sed 's/.*"\(.*\)"/\1/')"
          echo "Attempt $attempt: $(wc -c < "$DEST") bytes, blob SHA ${BLOB:-unknown}"

          if cmake -DNEEDFUL_H_DIR="$NEEDFUL_H_DIR" \
                   -P tests/run-header-integrity.cmake; then
            echo "NEEDFUL_H_DIR=$NEEDFUL_H_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$attempt" -eq 4 ]; then
            echo "::error::needful.h failed its integrity check on every attempt."
            echo "::error::This looks like a damaged commit upstream, not a stale cache."
            exit 1
          fi

          echo "::warning::needful.h failed its integrity check (attempt $attempt of 4)."
          echo "::warning::Retrying in 120s in case an intermediary is serving a stale copy."
          sleep 120
        done


  #====# TOOLCHAIN SETUP #=====================================================#

    # By default you can't call MSVC from the command line; this action sets
    # up the environment.
    #
    # https://github.com/ilammy/msvc-dev-cmd
    #
    # See Ren-C README: !!! IMPORTANT - Untrusted Actions, Use Audited Hash !!!
    #
    - name: Enable MSVC CL.EXE and Build Tools
      if: matrix.msvc
      uses: ilammy/msvc-dev-cmd@aa2e60900e4cc1eda092dd8f53dab2b32efeacf5


    # Using bash means a symlink /usr/bin/link gets in the path before
    # MSVC's LINK.EXE.  Move it aside so the linker is found correctly.
    #
    # https://github.com/ilammy/msvc-dev-cmd/issues/25
    #
    - name: Move GNU link Aside So MSVC LINK.EXE Is Found
      if: matrix.msvc
      run: mv /usr/bin/link.exe /usr/bin/gnu-link


    - name: Check Enhanced Headers Use NEEDFUL_ASSERT
      run: python tools/check-no-raw-assert.py


  #====# BUILD AND TEST STEPS #================================================#

    - name: Configure Tests With CMake
      working-directory: tests
      run: |
        cmake -B build \
          -G "${{ matrix.cmake-generator }}" \
          -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
          -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
          -DNEEDFUL_H_DIR="$NEEDFUL_H_DIR"


    # Positive tests are compiled to binaries here; negative tests are
    # compiled (and expected to fail) during ctest itself, not here.
    #
    - name: Build Positive Tests
      working-directory: tests
      run: cmake --build build


    # --output-on-failure prints compiler output for any failing negative test
    # that unexpectedly succeeded in compiling.
    #
    - name: Run All Tests (CTest)
      working-directory: tests
      run: ctest --test-dir build -V --output-on-failure


    # CTest above builds tests/c/ at whatever C standard CMake picked.  This
    # step sweeps the standards explicitly, because the whole point of the C
    # tests is that needful.h stays portable C -- and a single standard can
    # hide, say, a C99 compound literal that C89 rejects.
    #
    # -Werror is deliberately NOT set yet.  Turn it on once the GCC/Clang
    # output is confirmed clean; MSVC /W4 already is.
    #
    - name: Compile As C At Several Standards
      if: '!matrix.msvc'
      working-directory: tests
      run: |
        for std in c99 c11 c17; do
          echo "=== -std=$std ==="
          ${{ matrix.cc }} -std=$std -Wall -Wextra -Wpedantic \
            -I "$NEEDFUL_H_DIR" \
            c/test-needful-c-sweep.c -o "/tmp/c-sweep-$std"
          "/tmp/c-sweep-$std"
        done


    # Same idea for MSVC, whose C standard flags differ.  /W4 is MSVC's
    # equivalent of -Wall -Wextra; /TC forces C even for a .c file.
    #
    - name: Compile As C At Several Standards (MSVC)
      if: matrix.msvc
      working-directory: tests
      run: |
        for std in c11 c17; do
          echo "=== /std:$std ==="
          cl //nologo //TC //std:$std //W4 \
            //I"$(cygpath -w "$NEEDFUL_H_DIR")" \
            //Fe:"c-sweep-$std.exe" c/test-needful-c-sweep.c
          "./c-sweep-$std.exe"
        done


    # Run the Python negative-test driver with error-phrase verification.
    # This adds the MATCH-ERROR-TEXT check that CTest's WILL_FAIL cannot do:
    # it verifies that each negative test failed for the *right* reason, not
    # because of a typo in the test file.  With --match-error-text, any test
    # lacking a MATCH-ERROR-TEXT comment is also a hard failure.
    #
    # Pass --extra-dir to also check any negative doctests extracted from docs/.
    #
    - name: Verify Negative Tests Failed For The Right Reason
      working-directory: tests
      run: |
        EXTRA_ARGS=""
        if [ -d doctest-extracted/negative ]; then
          EXTRA_ARGS="--extra-dir doctest-extracted/negative"
        fi
        python run-negative-tests.py --match-error-text --needful-dir "$NEEDFUL_H_DIR" $EXTRA_ARGS
