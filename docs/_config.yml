title: Needful
description: >
  Single-header C library with Rust-grade safety when built as C++.
  Zero runtime cost, no dependencies, no tools beyond your compiler.

url: "https://needful.metaeducation.com"
baseurl: ""

# Use just-the-docs theme for clean technical documentation.
# https://just-the-docs.com
remote_theme: just-the-docs/just-the-docs@v0.10.0

# "Needful" look: deep green with saffron accents, matching the banner art.
# Variables: _sass/color_schemes/needful.scss.  Fonts: _sass/custom/setup.scss
# (loaded by _includes/head_custom.html).  Ornaments: _sass/custom/custom.scss.
color_scheme: needful
favicon_ico: "/assets/images/favicon.ico"
callouts_level: loud  # light text on tinted background (we are a dark scheme)
callouts:
  note:
    title: Note
    color: green
  tip:
    title: Tip
    color: yellow
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: purple

enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"

# Syntax highlighting
highlighter: rouge

# Show the "Edit this page on GitHub" link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/metaeducation/needful-enhanced"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "edit"

# Navigation order is set in each page's front matter via nav_order.
# See: https://just-the-docs.com/docs/navigation-structure/

aux_links:
  "GitHub":
    - "https://github.com/metaeducation/needful-enhanced"
  "needful.h (raw)":
    - "https://raw.githubusercontent.com/metaeducation/needful/refs/heads/main/needful.h"

# GitHub Pages only runs a fixed set of plugins unless asked for more.
# jekyll-sitemap is on its allowed list but not on by default: it writes
# /sitemap.xml from `url` above, and a /robots.txt pointing at it.
plugins:
  - jekyll-sitemap

# Keep non-pages out of the sitemap: the notes for people editing these docs,
# and the search-console ownership file.
defaults:
  - scope:
      path: "README.md"
    values:
      sitemap: false
  - scope:
      path: "google5a96c048c7bff038.html"
    values:
      sitemap: false
