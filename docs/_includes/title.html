{%- comment -%}
  Overrides just-the-docs' _includes/title.html: the sidebar site title.
  Shows the mandala mark (cropped from the banner) beside a serif wordmark.
  Styled by .needful-mark / .needful-wordmark in _sass/custom/custom.scss.
{%- endcomment -%}
<img class="needful-mark" src="{{ '/assets/images/needful-mark.png' | relative_url }}" alt="" width="38" height="38">
<span class="needful-wordmark">{{ site.title }}</span>
